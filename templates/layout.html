{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme='dark'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>
{% block title  %}{% endblock %}    
</title>
    {% comment %} <link rel="stylesheet" href="{% static 'style.css' %}"> {% endcomment %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">HeartBar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'Home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'About'%}">About</a>
        </li>
        <a class="nav-link" href="{% url 'all_heart_view' %}">
            Heart Prediction
        </a>
      </ul>
    <div class="d-flex gap-3">
    {%if user.is_authenticated%}
      <form method="post" action="{%url 'logout'%}">
        {% csrf_token %}
      <button class="btn btn-danger">Logout</button>
      </form>
      {%else%}
      <a class="btn btn-outline-success" href="{% url 'login'%}">
        Login
    </a>
    <a class="btn btn-outline-primary" href="{% url 'register' %}">
        Register
    </a>
      {%endif%}
</div>
    </div>
  </div>
</nav>
<div class="container">
    {% block content %}
    Defalut Value
    {% endblock %}
</div>
</body>
</html>
