{% extends "layout.html" %}

{% block title %}{% endblock %}

{% block content %}
<h1 class="text-center text-white mt-4">This the Logout page</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    {% if form.errors %}
        <div class="alert alert-danger">
            {{ form.errors }}
        </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">Logout</button>
</form>
{% endblock %}
