{% extends "layout.html" %}

{% block title %}Logout{% endblock %}

{% block content %}
<section class="card card-narrow">
    <h1 class="card-title">Logout</h1>
    <p class="card-text">Click below to sign out of your account.</p>
    <form method="POST" class="form">
        {% csrf_token %}
        {{ form.as_p }}

        {% if form.errors %}
            <div class="alert alert-error">
                {{ form.errors }}
            </div>
        {% endif %}

        <div class="form-actions">
            <button type="submit" class="button button-danger button-block">Logout</button>
        </div>
    </form>
</section>
{% endblock %}
