{% extends "layout.html" %}
{% load static %}

{% block title %}
Heart Prediction
{% endblock title %}

{% block content %}
<img src="{% static 'images/heart.png' %}" height="100" width="250" alt="Heart">
<h1 class="page-title">Heart Prediction</h1>
<p class="page-subtitle">Fill in every field, then submit to run the model.</p>

<section class="card">
    <form method="POST" class="form">
        {% csrf_token %}
        <div class="form-grid">
            {{ form.as_p }}
        </div>
        <div class="form-actions">
            <button type="submit" class="button button-primary">Predict</button>
        </div>
    </form>
</section>

{% if prediction %}
<div class="alert">
    <h2>{{ prediction }}</h2>
</div>
{% endif %}
{% endblock content %}
